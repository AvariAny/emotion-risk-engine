[project]
name = "emotion-risk-engine"
version = "2.0.0"
description = "AI API for Emotional Risk Detection"
requires-python = ">=3.10"
dependencies = [
    # Web / API
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "starlette==1.6.0",

    # Database
    "SQLAlchemy",
    "psycopg2-binary",

    # Settings / Config
    "python-dotenv==1.2.3",

    # ML / NLP
    "torch",
    "transformers",
    "sentence-transformers",
    "tokenizers",
    "safetensors",
    "huggingface_hub",

    # Data / Utils
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",

    # Validation
    "pydantic>=2.0.0",
    "typing_extensions",

    # HTTP client / utils
    "requests",
    "httpx",
    "certifi",
    "urllib3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = false

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.vercel]
entrypoint = "app.api.main:app"